<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 30" width="800" height="30">
  <defs>
    <filter id="glow-line">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="30" fill="#0a0a0a"/>
  <line x1="50" y1="15" x2="750" y2="15" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>
  <circle r="3" fill="#64ffda" opacity="0.8" filter="url(#glow-line)">
    <animate attributeName="cx" from="50" to="750" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <polygon points="400,8 407,15 400,22 393,15" fill="none" stroke="#64ffda" stroke-width="0.5" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="50" cy="15" r="2" fill="#ffffff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="15" r="2" fill="#ffffff" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
