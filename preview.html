<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Preview - Wagner Caetano</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown-dark.min.css">
  <style>
    body {
      background-color: #0d1117;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
      min-height: 100vh;
    }
    .markdown-body {
      max-width: 900px;
      width: 100%;
      background: #0d1117;
      color: #e6edf3;
      padding: 20px;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #e6edf3;
      border-bottom-color: #30363d;
    }
    .markdown-body a {
      color: #58a6ff;
    }
    .markdown-body code {
      background: #161b22;
      color: #e6edf3;
    }
    .markdown-body pre {
      background: #161b22;
    }
    .markdown-body table td, .markdown-body table th {
      border-color: #30363d;
    }
    .markdown-body img {
      max-width: 100%;
    }
    .markdown-body sub b {
      color: #8b949e;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <article class="markdown-body" id="content"></article>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('README.md')
      .then(r => r.text())
      .then(text => {
        document.getElementById('content').innerHTML = marked.parse(text);
      })
      .catch(err => console.error('Error loading README:', err));
  </script>
</body>
</html>
